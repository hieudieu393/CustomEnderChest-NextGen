name: Data Safety CI

on:
  push:
    branches: [master, dev, 'fix/**']
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-safety-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Java 21 - data safety
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build and run real regression tests
        run: bash ./gradlew clean build --no-daemon --stacktrace --console=plain
      - name: Verify tests ran and verify shaded plugin
        run: python3 scripts/ci/verify_artifacts.py
      - name: Upload test reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}-${{ github.run_id }}
          path: |
            build/test-results/test/
            build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload candidate only after all gates pass
        uses: actions/upload-artifact@v4
        with:
          name: candidate-NOT-PRODUCTION-${{ github.sha }}-${{ github.run_id }}
          path: |
            build/libs/CustomEnderChest-NextGen-*.jar
            build/libs/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
